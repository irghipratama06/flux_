<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ember – Chat Trading Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#101010;--line:#2a1a0a;--or:#ff7a00;--or2:#ffa040;--tx:#f4efe8;--mu:#8d8478;--ok:#4ade80;--er:#f87171}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 'Space Grotesk',system-ui,sans-serif}
body{padding-top:env(safe-area-inset-top,0)}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.btn{background:var(--or);color:#000;font-weight:700;padding:14px 18px;width:100%}
.btn.ghost{background:transparent;color:var(--or);border:1px solid var(--or)}
.btn:disabled{opacity:.5}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:28px}
h1{font-size:44px;line-height:1;letter-spacing:-1.5px;font-weight:700}
h1 b{color:var(--or)}
.mu{color:var(--mu)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:18px}.logo i{color:var(--or);font-style:normal}
.pill{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--or2)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;color:var(--mu);padding:12px;border-radius:0;border-bottom:2px solid transparent}
.tabs button.on{color:var(--or);border-color:var(--or)}
#chat,#pf{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.m.u{align-self:flex-end;background:var(--or);color:#000;border-bottom-right-radius:4px}
.m.b{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts button{padding:9px 14px;background:var(--or);color:#000;font-weight:700}
.acts button.n{background:transparent;color:var(--or);border:1px solid var(--or)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px 8px}
.chips button{white-space:nowrap;background:var(--panel);color:var(--or2);border:1px solid var(--line);padding:7px 12px;border-radius:99px;font-size:13px}
form{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0));border-top:1px solid var(--line)}
input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:13px;font:inherit;font-size:16px}
input:focus{outline:2px solid var(--or)}
form button{background:var(--or);color:#000;font-weight:700;padding:0 18px}
.big{font-size:38px;font-weight:700;letter-spacing:-1px}
.up{color:var(--ok)}.er{color:var(--er)}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
// ---------- Config ----------
const PRICES={UCT:0.45,SOL:150,BTC:65000,ETH:3000,USDT:1}; // indicative demo prices – replace with a live price feed
const ALIAS={uct:'UCT',unicity:'UCT',sol:'SOL',solana:'SOL',btc:'BTC',bitcoin:'BTC',eth:'ETH',ethereum:'ETH',usdt:'USDT',usdc:'USDT'};
const CHAINS={UCT:'Unicity',SOL:'Solana',BTC:'Bitcoin',ETH:'Ethereum',USDT:'Ethereum'};
const FEE=0.003;
const KEY='ember_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(n,d=4)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
const usd=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

let S={screen:'welcome',tab:'chat',wallet:null,bal:{UCT:1000,SOL:5,BTC:0.05,ETH:1,USDT:250},hist:[],msgs:[]};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x){S.bal=x.bal||S.bal;S.hist=x.hist||[]}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({bal:S.bal,hist:S.hist}))}catch(e){}};
let client=null,pending=null;

// ---------- Wallet connection (Sphere Connect) ----------
async function connect(){
  const b=$('#cb');b.disabled=true;b.textContent='Connecting…';
  try{
    const {autoConnect}=await import('https://esm.sh/@unicitylabs/sphere-sdk/connect/browser');
    const {SPHERE_NETWORKS}=await import('https://esm.sh/@unicitylabs/sphere-sdk/connect');
    const r=await autoConnect({
      dapp:{name:'Ember Trading Agent',url:location.origin,icon:location.origin+'/favicon.ico'},
      network:SPHERE_NETWORKS.testnet2,
      permissions:['identity:read','balance:read','tokens:read','transfer:request','sign:request'],
      walletUrl:'https://sphere.unicity.network',
      silent:false
    });
    client=r.client;
    const id=r.connection.identity||{};
    S.wallet={real:true,name:id.nametag?('@'+id.nametag):'Sphere wallet',addr:id.directAddress||id.chainPubkey||'—'};
    client.on&&client.on('wallet:disconnected',()=>{S.wallet=null;client=null;S.screen='welcome';render()});
    S.screen='confirm';render();
  }catch(e){
    b.disabled=false;b.textContent='Connect Sphere Wallet';
    $('#err').innerHTML='Could not connect: '+esc(e&&e.message||e)+'<br>Open the app in a browser that can reach sphere.unicity.network, or try Demo Mode.';
  }
}
function demo(){S.wallet={real:false,name:'Demo wallet',addr:'demo-0x7a…c3f1'};S.screen='confirm';render()}

// ---------- Command parser ----------
function parse(t){
  t=t.trim().toLowerCase();
  const m=t.match(/^(swap|bridge|send|convert|tukar)\s+([\d.,]+)\s+(\w+)\s+(?:to|ke|into|->|→)\s+(.+)$/);
  if(!m)return null;
  const from=ALIAS[m[3]];
  const tos=m[4].split(/\s+(?:or|atau)\s+|,\s*/).map(x=>ALIAS[x.trim()]).filter(Boolean);
  return{verb:m[1]==='tukar'||m[1]==='convert'?'swap':m[1],amt:parseFloat(m[2].replace(',','.')),from,tos};
}
function quote(c,to){
  const gross=c.amt*PRICES[c.from]/PRICES[to];
  return{to,out:gross*(1-FEE),fee:c.amt*FEE};
}

// ---------- Chat ----------
function bot(html,acts){S.msgs.push({r:'b',h:html,acts});drawChat()}
function say(t){S.msgs.push({r:'u',t});drawChat()}
function handle(text){
  say(text);
  const low=text.toLowerCase();
  if(/^(portfolio|balance|balances)/.test(low)){S.tab='pf';render();return}
  if(/^(help|\?)/.test(low))return bot(helpText());
  const c=parse(text);
  if(!c||!c.from)return bot("I didn't understand that.\n"+helpText());
  if(!c.tos.length)return bot('Unknown target token. Supported: UCT, SOL, BTC, ETH, USDT.');
  if(!(c.amt>0))return bot('Enter an amount greater than zero.');
  if(c.tos.length>1){
    return bot('Which one do you want to '+c.verb+' '+c.amt+' '+c.from+' into?',c.tos.map(t=>({l:t,f:()=>handle(c.verb+' '+c.amt+' '+c.from+' to '+t)})));
  }
  const to=c.tos[0];
  if(to===c.from)return bot('Source and target are the same token.');
  if((S.bal[c.from]||0)<c.amt)return bot('Insufficient '+c.from+'. You hold '+fmt(S.bal[c.from]||0)+' '+c.from+'.');
  const q=quote(c,to);
  const cross=CHAINS[c.from]!==CHAINS[to];
  const kind=cross||c.verb==='bridge'?'Bridge':'Swap';
  pending={...c,to,q,kind};
  bot('<b>'+kind+' preview</b>\nPay: '+fmt(c.amt)+' '+c.from+' ('+CHAINS[c.from]+')\nReceive: ≈ '+fmt(q.out)+' '+to+' ('+CHAINS[to]+')\nFee: '+fmt(q.fee)+' '+c.from+' (0.3%)\n\nConfirm to execute.',
    [{l:'Confirm',f:execute},{l:'Cancel',n:1,f:()=>{pending=null;bot('Cancelled.')}}]);
}
function helpText(){return 'Try:\n• swap 10 uct to solana\n• swap 1 sol to uct\n• bridge 5 uct to bitcoin\n• swap 10 uct to solana or bitcoin\n• portfolio'}
async function execute(){
  if(!pending)return;const p=pending;pending=null;
  bot('Executing '+p.kind.toLowerCase()+'… approve in your wallet if prompted.');
  try{
    if(S.wallet.real&&client){
      // Wallet approves via intent. Adjust action/params to your routing backend.
      await client.intent('transfer',{coinId:p.from,amount:String(p.amt),memo:p.kind.toLowerCase()+':'+p.from+'->'+p.to});
    }else await new Promise(r=>setTimeout(r,900));
    S.bal[p.from]=(S.bal[p.from]||0)-p.amt;
    S.bal[p.to]=(S.bal[p.to]||0)+p.q.out;
    S.hist.unshift({t:Date.now(),k:p.kind,from:p.from,amt:p.amt,to:p.to,out:p.q.out,demo:!S.wallet.real});
    S.hist=S.hist.slice(0,50);save();
    bot('✅ Done. '+fmt(p.amt)+' '+p.from+' → '+fmt(p.q.out)+' '+p.to+(S.wallet.real?'':'\n(Demo Mode: simulated trade)'));
  }catch(e){
    const code=e&&e.code;
    if(code===4003)bot('You rejected the request in your wallet. Nothing was sent.');
    else if(code===4201)bot('⚠️ Outcome unknown: the wallet took the request but the answer was lost. Do NOT retry. Check your wallet history first.');
    else if(code===4009)bot('Your wallet is locked. Unlock it, then send the command again.');
    else bot('Failed: '+(e&&e.message||e));
  }
}

// ---------- Rendering ----------
function render(){
  const a=$('#app');
  if(S.screen==='welcome'){
    a.innerHTML='<div class="center"><h1>Ember<b>.</b><br>Trade by typing.</h1><p class="mu">Swap and bridge tokens with plain commands like “swap 10 uct to solana”. Connect your wallet to start.</p><button id="cb" class="btn">Connect Sphere Wallet</button><button id="db" class="btn ghost">Try Demo Mode</button><p id="err" class="er" style="font-size:13px"></p></div>';
    $('#cb').onclick=connect;$('#db').onclick=demo;return;
  }
  if(S.screen==='confirm'){
    const w=S.wallet;
    a.innerHTML='<div class="center"><h1>Confirm<b>.</b></h1><div class="box"><div class="row"><span class="mu">Wallet</span><span>'+esc(w.name)+'</span></div><div class="row"><span class="mu">Address</span><span>'+esc(String(w.addr).slice(0,22))+'</span></div><div class="row"><span class="mu">Mode</span><span>'+(w.real?'Sphere Connect':'Demo')+'</span></div></div><p class="mu" style="font-size:13px">The agent can read your balance and prepare trades. Every trade needs your explicit confirmation before it runs.</p><button id="ok" class="btn">Confirm and enter</button><button id="no" class="btn ghost">Disconnect</button></div>';
    $('#ok').onclick=()=>{S.screen='main';if(!S.msgs.length)S.msgs.push({r:'b',h:'Connected as <b>'+esc(S.wallet.name)+'</b>.\n\n'+helpText()});render()};
    $('#no').onclick=()=>{S.wallet=null;client=null;S.screen='welcome';render()};return;
  }
  a.innerHTML='<div class="top"><span class="logo">Ember<i>.</i></span><span class="pill">'+esc(S.wallet.name)+(S.wallet.real?'':' · demo')+'</span></div><div class="tabs"><button data-t="chat">Chat</button><button data-t="pf">Portfolio</button></div><div id="body" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>';
  document.querySelectorAll('.tabs button').forEach(b=>{b.className=b.dataset.t===S.tab?'on':'';b.onclick=()=>{S.tab=b.dataset.t;render()}});
  S.tab==='chat'?drawChatShell():drawPortfolio();
}
function drawChatShell(){
  $('#body').innerHTML='<div id="chat"></div><div class="chips"></div><form id="f"><input id="in" placeholder="swap 10 uct to solana" autocomplete="off" autocapitalize="none"><button>Send</button></form>';
  const ch=['swap 10 uct to solana','swap 1 sol to uct','bridge 5 uct to bitcoin','portfolio'];
  const c=$('.chips');ch.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>handle(t);c.appendChild(b)});
  $('#f').onsubmit=e=>{e.preventDefault();const i=$('#in');if(i.value.trim()){const v=i.value;i.value='';handle(v)}};
  drawChat();
}
function drawChat(){
  const c=$('#chat');if(!c)return;c.innerHTML='';
  S.msgs.forEach(m=>{
    const d=document.createElement('div');d.className='m '+m.r;
    if(m.r==='u')d.textContent=m.t;else{d.innerHTML=m.h;
      if(m.acts){const w=document.createElement('div');w.className='acts';
        m.acts.forEach(a=>{const b=document.createElement('button');b.textContent=a.l;if(a.n)b.className='n';b.onclick=()=>{m.acts=null;a.f();drawChat()};w.appendChild(b)});d.appendChild(w)}}
    c.appendChild(d)});
  c.scrollTop=c.scrollHeight;
}
function drawPortfolio(){
  const rows=Object.entries(S.bal).filter(([,v])=>v>1e-9).sort((a,b)=>b[1]*PRICES[b[0]]-a[1]*PRICES[a[0]]);
  const tot=rows.reduce((s,[k,v])=>s+v*PRICES[k],0);
  let h='<div class="box"><div class="mu">Total value</div><div class="big">'+usd(tot)+'</div><div class="mu" style="font-size:12px">'+(S.wallet.real?'Ledger of trades made in this app':'Demo ledger')+' · indicative prices</div></div>';
  h+='<div class="box">'+rows.map(([k,v])=>'<div class="row"><span><b>'+k+'</b> <span class="mu">'+CHAINS[k]+'</span></span><span style="text-align:right">'+fmt(v)+'<br><span class="mu" style="font-size:12px">'+usd(v*PRICES[k])+'</span></span></div>').join('')+'</div>';
  h+='<div class="box"><b>History</b>'+(S.hist.length?S.hist.map(x=>'<div class="row" style="font-size:13px"><span>'+x.k+' '+fmt(x.amt)+' '+x.from+' → '+fmt(x.out)+' '+x.to+'</span><span class="mu">'+new Date(x.t).toLocaleDateString()+'</span></div>').join(''):'<p class="mu">No trades yet. Open Chat and type a command.</p>')+'</div>';
  $('#body').innerHTML='<div id="pf">'+h+'</div>';
}
render();
</script>
</body>
</html>
